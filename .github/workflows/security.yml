name: Dependency security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.19'
          python-version: '3.12'
      - run: uv sync --locked --extra dev
      - name: Audit all locked runtime, build and development dependencies
        run: |
          mkdir -p /tmp/dependency-audit
          uv export --locked --extra dev --no-emit-project --format pylock.toml --output-file /tmp/dependency-audit/pylock.toml
          uv run --locked pip-audit --locked /tmp/dependency-audit --strict
