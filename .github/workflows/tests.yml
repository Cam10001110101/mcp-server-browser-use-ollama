name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.19'
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Check Python syntax and critical lint errors
        run: uv run --locked ruff check --select E9,F63,F7,F82 src tests
      - name: Run unit and MCP protocol tests
        run: uv run --locked pytest -m 'not e2e' --cov=src --cov-report=xml
      - name: Install Chromium
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv run --locked playwright install --with-deps chromium
      - name: Permit the installed Chromium to create its sandbox
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        run: |
          browser_path="$(uv run --locked python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$browser_path" >> "$GITHUB_ENV"
          # Ubuntu restricts user namespaces through AppArmor. Permit only this
          # executable; keep system restrictions and Chromium sandboxing enabled.
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile playwright-chromium "%s" flags=(unconfined) {\n  userns,\n}\n' "$browser_path" | sudo tee /etc/apparmor.d/playwright-chromium > /dev/null
          sudo apparmor_parser -r /etc/apparmor.d/playwright-chromium
      - name: Run sandboxed browser security test
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          RUN_BROWSER_TESTS: '1'
        run: uv run --locked pytest -m e2e
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
